securityDefinitions:
  APITokenAuth:
    description: 使用 API Token 进行认证，用于 Open API 访问
    in: header
    name: X-API-Token
    type: apiKey
  BearerAuth:
    description: 使用 JWT Token 进行认证，格式：Bearer {token}
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
